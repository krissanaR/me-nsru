<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>OG card source — 1200x630</title>
<!--
  Source for site/assets/img/og-cover.jpg.
  Rendered at exactly 1200x630 by tools/build-og.sh. Not deployed.
  Edit here, re-run the build script, never hand-edit the jpg.
-->
<link rel="stylesheet" href="../site/css/fonts.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;
       font-family:'IBM Plex Sans Thai',sans-serif;background:#16202F}

  .card{position:relative;width:1200px;height:630px;overflow:hidden}

  /* lab.webp is not a plain photo — it is a composite that carries its own
     baked-in captions. Unblurred they read as a second, competing layer of
     text at thumbnail size, so soften it and let it work as texture only.
     scale() hides the transparent edge blur pulls in. */
  .bg{position:absolute;inset:0;
      background:url(../site/assets/img/lab.webp) center/cover no-repeat;
      filter:blur(4px) saturate(.85);transform:scale(1.05)}

  /* Two layers: the hero's 100deg wash for the text side, plus a vertical
     pass that buries the source captions along the bottom edge. */
  .scrim{position:absolute;inset:0;
    background:
      linear-gradient(180deg,
        rgba(22,32,47,.40) 0%, rgba(22,32,47,.24) 42%,
        rgba(22,32,47,.88) 86%, rgba(22,32,47,.96) 100%),
      linear-gradient(100deg,
        rgba(22,32,47,.97) 0%, rgba(22,32,47,.94) 44%,
        rgba(22,32,47,.64) 78%, rgba(22,32,47,.44) 100%)}

  /* The red rule echoes .accred's 6px left border. */
  .edge{position:absolute;left:0;top:0;bottom:0;width:14px;background:#B4141F}

  .body{position:relative;height:100%;padding:64px 72px 60px 86px;
        display:flex;flex-direction:column;justify-content:space-between}

  .top{display:flex;align-items:center;gap:20px}
  .top img{width:74px;height:74px;border-radius:50%;object-fit:cover;flex:none}
  .top b{display:block;color:#fff;font-size:25px;font-weight:600;line-height:1.3}
  .top small{display:block;font-family:'IBM Plex Mono',monospace;
             font-size:14px;letter-spacing:.16em;color:#93A0B4;margin-top:4px}

  h1{margin:0 0 20px;color:#fff;font-size:66px;font-weight:700;
     line-height:1.1;letter-spacing:-.02em}
  h1 em{font-style:normal;color:#F26A73}

  .lede{margin:0;color:#B9C3D2;font-size:25px;line-height:1.45;max-width:750px}

  .pill{display:inline-flex;align-items:center;gap:13px;background:#B4141F;
        color:#fff;padding:10px 20px;font-size:19px;font-weight:600;
        margin-bottom:26px;align-self:flex-start}
  .pill .code{font-family:'IBM Plex Mono',monospace;letter-spacing:.1em}
  .pill .bar{width:1px;height:18px;background:rgba(255,255,255,.45)}

  .foot{display:flex;align-items:baseline;gap:18px;
        font-family:'IBM Plex Mono',monospace;font-size:17px;
        letter-spacing:.12em;color:#6E7C92}
  .foot .dot{color:#B4141F}
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="scrim"></div>
  <div class="edge"></div>

  <div class="body">
    <div class="top">
      <img src="../site/assets/img/logo.jpg" alt="">
      <span>
        <b>สาขาวิชาวิศวกรรมเครื่องกล</b>
        <small>MECHANICAL ENGINEERING &middot; NSRU</small>
      </span>
    </div>

    <div>
      <div class="pill">
        <span class="code">COE</span>
        <span class="bar"></span>
        <span>สภาวิศวกรรับรองปริญญา</span>
      </div>
      <h1>เรียนวิศวกรรมเครื่องกล<br><em>ที่ได้ลงมือทำจริง</em></h1>
      <p class="lede">วศ.บ. 4 ปี &middot; รับรองโดยสภาวิศวกร &middot; เปิดรับภาคปกติและเทียบโอน</p>
    </div>

    <div class="foot">
      <span>มหาวิทยาลัยราชภัฏนครสวรรค์</span>
      <span class="dot">&#9679;</span>
      <span>ปีการศึกษา 2569</span>
    </div>
  </div>
</div>
</body>
</html>
